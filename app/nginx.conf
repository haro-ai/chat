# Static SPA host (dynames). R5: serves files only — nothing persisted,
# nothing proxied, no logs of content.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: connection list ↔ chat view is client-side state.
  location / {
    try_files $uri /index.html;
  }

  # Immutable hashed assets.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Shell + PWA bits must revalidate (R2: cached shell, fresh updates).
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  location ~* \.(webmanifest|svg|png|html)$ {
    add_header Cache-Control "no-cache";
  }
}